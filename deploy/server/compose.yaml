services:
  xiaoelong_home:
    image: node:22.23.1-bookworm-slim
    container_name: xiaoelong_home
    restart: unless-stopped
    init: true
    working_dir: /app/server
    command: ["node", "dist/index.js"]
    env_file:
      - /opt/xiaoelong_home/server/.env
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
    ports:
      - "3001:3001"
    volumes:
      - /opt/xiaoelong_home:/app
    networks:
      - panel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
networks:
  panel:
    external: true
    name: 1panel-network
