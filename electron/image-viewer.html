<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:3001 http://127.0.0.1:3001 http://43.139.223.204:3001 data: blob:; img-src * data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #eef1f3;
      color: #263238;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    .viewer {
      display: grid;
      grid-template-rows: 42px minmax(0, 1fr) 34px;
      width: 100vw;
      height: 100vh;
      padding: 10px;
      gap: 8px;
    }
    .topbar {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }
    .meta {
      min-width: 0;
      overflow: hidden;
      color: rgba(38, 50, 56, 0.72);
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    button {
      -webkit-app-region: no-drag;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(83, 101, 111, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: #263238;
      cursor: pointer;
      font: inherit;
    }
    button:hover { background: #fff; }
    .close {
      width: 34px;
      height: 34px;
      padding: 0;
      font-size: 24px;
      line-height: 1;
    }
    .stage {
      position: relative;
      display: grid;
      min-height: 0;
      place-items: center;
      overflow: hidden;
      border-radius: 14px;
      background: #dde3e7;
    }
    img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .nav {
      position: absolute;
      top: 50%;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      color: rgba(38, 50, 56, 0.76);
      padding: 0;
      font-size: 44px;
      line-height: 1;
      transform: translateY(-50%);
    }
    .nav:hover {
      background: transparent;
      color: #263238;
    }
    .previous { left: 12px; }
    .next { right: 12px; }
    .caption {
      min-width: 0;
      overflow: hidden;
      color: rgba(38, 50, 56, 0.66);
      font-size: 12px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="viewer">
    <header class="topbar">
      <div class="meta" id="meta"></div>
      <button type="button" class="close" id="close" aria-label="关闭">×</button>
    </header>
    <section class="stage">
      <button type="button" class="nav previous" id="previous" aria-label="上一张">‹</button>
      <img id="image" alt="" />
      <button type="button" class="nav next" id="next" aria-label="下一张">›</button>
    </section>
    <div class="caption" id="caption"></div>
  </main>
  <script>
    const meta = document.getElementById("meta");
    const caption = document.getElementById("caption");
    const image = document.getElementById("image");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    const close = document.getElementById("close");

    function render(state) {
      const images = state.images || [];
      const current = images[state.index] || null;
      previous.style.display = images.length > 1 ? "inline-grid" : "none";
      next.style.display = images.length > 1 ? "inline-grid" : "none";
      if (!current) {
        meta.textContent = "";
        caption.textContent = "";
        image.removeAttribute("src");
        image.alt = "";
        return;
      }
      meta.textContent = current.userNickname || "";
      caption.textContent = current.name || "";
      image.src = current.url;
      image.alt = current.name || "";
    }

    previous.addEventListener("click", () => window.xiaoelongImageViewer.previous());
    next.addEventListener("click", () => window.xiaoelongImageViewer.next());
    close.addEventListener("click", () => window.xiaoelongImageViewer.close());
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        window.xiaoelongImageViewer.close();
      } else if (event.key === "ArrowLeft") {
        window.xiaoelongImageViewer.previous();
      } else if (event.key === "ArrowRight") {
        window.xiaoelongImageViewer.next();
      }
    });
    window.xiaoelongImageViewer.onStateChange(render);
  </script>
</body>
</html>
