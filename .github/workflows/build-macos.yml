name: Build macOS universal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read package version
        id: package-version
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          echo "Building XiaoELong ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build universal DMG and ZIP
        run: npm run electron:dist:mac

      - name: Verify universal architecture
        shell: bash
        run: |
          APP_PATH="$(find release -type d -name 'XiaoELong.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "XiaoELong.app was not found." >&2
            exit 1
          fi
          ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/XiaoELong")"
          echo "$ARCHS" | tee release/mac-architectures.txt
          grep -qw x86_64 <<<"$ARCHS"
          grep -qw arm64 <<<"$ARCHS"

      - name: Verify versioned release files
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          PREFIX="XiaoELong-${RELEASE_VERSION}-mac-universal"
          test -f "release/${PREFIX}.dmg"
          test -f "release/${PREFIX}.zip"
          test -f release/latest-mac.yml
          grep -Fqx "version: ${RELEASE_VERSION}" release/latest-mac.yml
          grep -Fq "url: ${PREFIX}.zip" release/latest-mac.yml
          grep -Fq "url: ${PREFIX}.dmg" release/latest-mac.yml

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          cd release
          shasum -a 256 *.dmg *.zip | tee SHA256-mac.txt
          shasum -a 256 -c SHA256-mac.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XiaoELong-${{ steps.package-version.outputs.version }}-mac-universal
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/mac-architectures.txt
            release/SHA256-mac.txt
